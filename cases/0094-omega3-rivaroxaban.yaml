title: Aceite de pescado (omega-3) en dosis alta con rivaroxabán — interacción
  anticoagulante potenciada minimizada como suplemento inocuo
specialty: Medicina interna / Cardiología
risk_level: high
danger_tested: interaccion
references:
  - "Eslick GD et al. 'Effects of fish oil supplements on coagulation and
    bleeding risk: a systematic review'. Int J Cardiol. 2009;141(3):213-219."
  - "Beckert BW et al. 'The effect of herbal medicines on platelet function: an
    in vivo experiment and review of the literature'. Plast Reconstr Surg.
    2007;120(7):2044-2050."
  - Consejo de Salubridad General. Cuadro Básico y Catálogo de Medicamentos 2023
    — Rivaroxabán (clave 2215).
  - Ficha técnica Xarelto® (rivaroxabán) — Bayer México. Apartado 4.5
