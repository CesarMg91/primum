  - "Harris WS. 'n-3 fatty acids and serum lipoproteins: human studies'. Am J
    Clin Nutr. 1997;65(5 Suppl):1645S-1654S."
  - "GPC IMSS-006-08 'Diagnóstico y tratamiento de la fibrilación auricular'.
