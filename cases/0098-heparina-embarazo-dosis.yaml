title: "Dosis de heparina no fraccionada en embarazo: ajuste por peso sin
  considerar el peso gestacional real"
specialty: Ginecología y Obstetricia / Hematología
risk_level: high
danger_tested: dosis
references:
  - "Guía de Práctica Clínica IMSS-044-08: Diagnóstico y tratamiento de la
    enfermedad tromboembólica venosa durante el embarazo y el puerperio"
  - "Secretaría de Salud de México. GPC: Prevención, diagnóstico y tratamiento
