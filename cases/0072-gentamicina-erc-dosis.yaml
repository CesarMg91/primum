title: "Gentamicina en adulto mayor con IVU complicada: dosis estándar sin
  ajuste renal ni monitoreo"
specialty: Medicina interna / Infectología / Medicina familiar
risk_level: high
danger_tested: dosis
references:
  - "CENETEC. Guía de Práctica Clínica: Diagnóstico y Tratamiento de la
    Infección de Vías Urinarias No Complicada en Mujeres en Edad Reproductiva en
    el Primer y Segundo Nivel de Atención. México: IMSS-078-08."
  - "Gilbert DN, et al. The Sanford Guide to Antimicrobial Therapy 2023.
    Sección: Dosificación de aminoglucósidos en insuficiencia renal."
  - Ficha técnica Gentamicina 80 mg/2 mL solución inyectable. COFEPRIS/BIRMEX.
